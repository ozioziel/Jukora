# Despliegue continuo al VPS (Oracle Cloud ARM64, aarch64).
# - Automático: cuando el CI termina EN VERDE sobre un push a main (es decir, al mergear un PR).
#   Imagen etiquetada `sha-<commit>`; las migraciones pendientes de Supabase se aplican solas.
# - Manual (Run workflow): para volver a desplegar o publicar una etiqueta concreta (ej. v0.1.0).
# No escribe en el repositorio. Los secretos viven en el Environment «production» de GitHub.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versión de imagen (ej. v0.1.0)'
        required: true
      run_migrations:
        description: 'Aplicar migraciones pendientes de Supabase antes de desplegar'
        type: boolean
        default: true
      platforms:
        description: 'Arquitecturas de las imágenes (el VPS es linux/arm64)'
        default: 'linux/arm64'

permissions:
  contents: read
  packages: write

# Un despliegue a la vez; el siguiente espera en cola (no cancela uno a medias).
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  prepare:
    # Solo pushes reales a main de este repositorio con el CI en verde (nunca PR ni forks), o ejecución manual.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      tag: ${{ steps.v.outputs.tag }}
      migrate: ${{ steps.v.outputs.migrate }}
      platforms: ${{ steps.v.outputs.platforms }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_TAG: ${{ inputs.tag }}
          IN_MIGRATE: ${{ inputs.run_migrations }}
          IN_PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            sha="$GITHUB_SHA"; tag="$IN_TAG"; migrate="$IN_MIGRATE"; platforms="$IN_PLATFORMS"
          else
            sha="$RUN_SHA"; tag="sha-${RUN_SHA:0:7}"; migrate="true"; platforms="linux/arm64"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit inválido: $sha"; exit 1; }
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo "Etiqueta inválida: $tag"; exit 1; }
          [[ "$platforms" =~ ^linux/(amd64|arm64)(,linux/(amd64|arm64))?$ ]] || { echo "Plataformas inválidas: $platforms"; exit 1; }
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "migrate=$migrate"
            echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"
          echo "Desplegando $tag (commit $sha) · migraciones: $migrate · $platforms" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # QEMU: solo las etapas que dependen del procesador (instalación de dependencias de
      # producción de la API) se ejecutan emuladas; TypeScript y Vite compilan nativo.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          platforms: ${{ needs.prepare.outputs.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jucumari-api:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=cd-api
          cache-to: type=gha,mode=max,scope=cd-api
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: ${{ needs.prepare.outputs.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jucumari-web:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha,scope=cd-web
          cache-to: type=gha,mode=max,scope=cd-web
          build-args: |
            VITE_API_URL=/api
            VITE_STELLAR_NETWORK=${{ vars.VITE_STELLAR_NETWORK || 'testnet' }}
            VITE_DEMO_MODE=${{ vars.VITE_DEMO_MODE || 'true' }}
            VITE_POLLAR_PUBLISHABLE_KEY=${{ vars.VITE_POLLAR_PUBLISHABLE_KEY }}

  migrations:
    needs: [prepare, images]
    if: ${{ needs.prepare.outputs.migrate == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Solo aplica las migraciones que aún no están en la base (si no hay ninguna, no hace nada).
      # Nunca `reset`. Las migraciones deben ser aditivas (ver docs/operacion-y-rollback.md).
      - name: Supabase db push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --yes supabase@2.119.0 db push --db-url "$SUPABASE_DB_URL" --yes

  deploy:
    needs: [prepare, images, migrations]
    if: ${{ always() && needs.prepare.result == 'success' && needs.images.result == 'success' && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en el VPS por SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          # Carpeta y puerto local de la app en el VPS (variables del Environment; con valores por defecto).
          APP_DIR: ${{ vars.VPS_APP_DIR || '/srv/penguinlab/apps/jukora' }}
          PORT: ${{ vars.VPS_WEB_PORT || '6704' }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" "cd '$APP_DIR' && \
            echo \"$TAG\" > .previous_tag.new && (cat .current_tag 2>/dev/null || echo none) > .previous_tag && mv .previous_tag.new .current_tag && \
            GHCR_OWNER=$OWNER IMAGE_TAG=$TAG WEB_PORT=$PORT docker compose -f docker-compose.prod.yml pull && \
            GHCR_OWNER=$OWNER IMAGE_TAG=$TAG WEB_PORT=$PORT docker compose -f docker-compose.prod.yml up -d && \
            { for i in \$(seq 1 24); do curl -fsS http://127.0.0.1:$PORT/api/health/ready && exit 0; sleep 5; done; \
              echo 'La API no respondió en 2 minutos'; exit 1; }"
          echo "Desplegado $TAG" >> "$GITHUB_STEP_SUMMARY"
